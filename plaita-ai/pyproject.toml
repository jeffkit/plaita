[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plaita-ai"
version = "0.1.0"
description = "AI integrations for Plaita — MCP tools, CLI, FoT agent, and flow-coder skills"
requires-python = ">=3.10"
authors = [
    { name = "Jeff kit", email = "bbmyth@gmail.com" },
]
dependencies = [
    "plaita>=0.5.0",
    # 上界必须 pin：mcp 2.x 把 FastMCP 改名为 MCPServer，`plaita-ai mcp`
    # 在全新安装下直接 ImportError（2026-09 盲区评审 P0-1）。
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
agent = [
    "langchain>=1.0",
    "langchain-core>=1.0",
]
# "fot" is an alias for "agent" kept for backward compatibility
fot = [
    "plaita-ai[agent]",
]
openai = [
    "langchain-openai>=0.3",
]
anthropic = [
    "langchain-anthropic>=0.3",
]
dev = [
    "pytest",
    "pytest-asyncio",
]
all = ["plaita-ai[agent,openai,anthropic,dev]"]

[project.scripts]
plaita-ai = "plaita_ai.cli.main:main"

[project.urls]
Homepage = "https://jeffkit.github.io/plaita/"
Repository = "https://github.com/jeffkit/plaita"
Documentation = "https://jeffkit.github.io/plaita/"

[tool.setuptools.packages.find]
include = ["plaita_ai", "plaita_ai.*"]

[tool.setuptools.package-data]
plaita_ai = [
    "skills/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
