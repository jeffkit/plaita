<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="600" height="300" fill="#f8f9fa" rx="10" ry="10"/>
  <text x="300" y="30" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="bold">事件系统最佳实践</text>
  
  <!-- 最佳实践列表 -->
  <g transform="translate(50, 60)">
    <!-- 实践1 -->
    <rect width="500" height="40" fill="#e8f5e9" stroke="#388e3c" stroke-width="1" rx="5" ry="5"/>
    <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">1. 使用明确的事件命名约定，如 domain.action</text>
    
    <!-- 实践2 -->
    <rect y="50" width="500" height="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="5" ry="5"/>
    <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">2. 为关键处理器设置合适的重试策略</text>
    
    <!-- 实践3 -->
    <rect y="100" width="500" height="40" fill="#fff8e1" stroke="#f57f17" stroke-width="1" rx="5" ry="5"/>
    <text x="250" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">3. 使用精确的过滤条件避免不必要的事件处理</text>
    
    <!-- 实践4 -->
    <rect y="150" width="500" height="40" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1" rx="5" ry="5"/>
    <text x="250" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">4. 在分布式环境中使用Redis实现</text>
    
    <!-- 实践5 -->
    <rect y="200" width="500" height="40" fill="#ffebee" stroke="#c62828" stroke-width="1" rx="5" ry="5"/>
    <text x="250" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">5. 定期清理过期的处理记录和历史数据</text>
  </g>
</svg> 