<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="280" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景和标题 -->
  <rect width="600" height="280" fill="#f8f9fa" rx="10" ry="10"/>
  <text x="300" y="30" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="bold">Plaita 事件系统架构</text>
  
  <!-- 组件框 -->
  <rect x="50" y="60" width="120" height="60" fill="#D5F5E3" stroke="#2ECC71" stroke-width="2" rx="5" ry="5"/>
  <text x="110" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">发布者</text>
  
  <rect x="430" y="60" width="120" height="60" fill="#D6EAF8" stroke="#3498DB" stroke-width="2" rx="5" ry="5"/>
  <text x="490" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">订阅者</text>
  
  <rect x="240" y="120" width="120" height="100" fill="#FAE5D3" stroke="#E67E22" stroke-width="2" rx="5" ry="5"/>
  <text x="300" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">事件总线</text>
  <text x="300" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">(EventBus)</text>
  <line x1="260" y1="175" x2="340" y2="175" stroke="#E67E22" stroke-width="1"/>
  <text x="300" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">内存 / Redis 实现</text>
  
  <rect x="240" y="230" width="120" height="40" fill="#F5EEF8" stroke="#8E44AD" stroke-width="2" rx="5" ry="5"/>
  <text x="300" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">事件存储</text>
  
  <!-- 连接线 -->
  <path d="M170 90 C210 90, 200 150, 240 150" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="190" y="110" font-family="Arial, sans-serif" font-size="12">发布</text>
  
  <path d="M360 150 C400 150, 390 90, 430 90" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="390" y="130" font-family="Arial, sans-serif" font-size="12">通知</text>
  
  <line x1="300" y1="220" x2="300" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 箭头标记 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg> 