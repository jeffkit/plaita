name: 引擎可靠性
sequential: true
service: redis   # exec 默认容器路由到 redis（redis-cli 断言注册表）

# 多实例消费、挂起幂等短路、终态幂等、事件订阅。拓扑前置：e2e.yaml 双 flow-worker
# （消费组分摊）。
#
# 语义注记（plaita#33 起的内核契约）：resume_type=continue / retry 打在**挂起**
# 执行上是**幂等 no-op**——两者都不携带推进语义（挂起节点等的是 event/cancel/
# timeout），入口直接短路返回 already_suspended：消息被 ack、状态原样保持
# suspended（旧行为把它终态化成不可恢复的 error，一次重复投递就把可唤醒的挂起
# 打成死局）。真正的推进路径是 resume_type=event，本 suite 用它把挂起执行推进到
# completed。
#
# DLQ 收容不在此 suite：需要激进 reclaim/max_deliveries 旋钮，放在共享消费组上会
# 抢兄弟 worker 处理中的任务（实测冷启动任务超 3s 即被回收误进 DLQ），该场景由
# e2e-chaos-dlq.sh 的独立清道夫 worker 承担。

cases:
  - name: "创建可靠性测试审批流程"
    request:
      method: POST
      url: http://localhost:18080/api/flows
      headers:
        Content-Type: application/json
      body:
        flow_id: "e2e-rel-flow"
        author: "e2e"
        desc: "reliability suite"
    expect:
      status: 200

  - name: "保存并发布"
    request:
      method: PUT
      url: http://localhost:18080/api/flows/e2e-rel-flow/versions/1.0.0
      headers:
        Content-Type: application/json
      body:
        definition: '{"id":"e2e-rel-flow","name":"E2E Rel","nodes":[{"id":"start","type":"start","next":"approval"},{"id":"approval","type":"approval","approval_title":"Rel","approval_content":"rel","approvers":["e2e"],"event_type":"approval_decision","next":"end"},{"id":"end","type":"end","result_type":"success"}]}'
        created_by: "e2e"
    expect:
      status: 200

  - name: "发布"
    request:
      method: POST
      url: http://localhost:18080/api/flows/e2e-rel-flow/publish
      headers:
        Content-Type: application/json
      body:
        version: "1.0.0"
    expect:
      status: 200

  - name: "启动审批流程"
    request:
      method: POST
      url: http://localhost:18080/api/executions
      headers:
        Content-Type: application/json
      body:
        flow_id: "e2e-rel-flow"
        version: "1.0.0"
        params: {}
    expect:
      status: 200
      body:
        status: "queued"

  - name: "审批执行挂起（轮询取 ID）"
    request:
      method: GET
      url: http://localhost:18080/api/executions?flow_id=e2e-rel-flow
    retry:
      maxAttempts: 15
      delay: 1s
    expect:
      status: 200
      body:
        total: { gte: 1 }
    save:
      rel_exec_id: "executions.0.execution_id"

  - name: "确认挂起"
    request:
      method: GET
      url: "http://localhost:18080/api/executions/{{runtime.rel_exec_id}}"
    retry:
      maxAttempts: 15
      delay: 1s
    expect:
      status: 200
      body:
        status: "suspended"

  # ── #33：挂起执行上的 continue / retry 是幂等 no-op ────────────────────────
  # 两者都不允许绕过 pending 挂起节点，内核短路返回 already_suspended：消息被
  # ack、状态**保持 suspended**（绝不翻 error）。旧契约「内核拒绝 → 终态 error」
  # 已随 #33 废弃。

  - name: "continue 打在挂起执行上 → 幂等跳过（请求受理，不报错）"
    request:
      method: POST
      url: "http://localhost:18080/api/executions/{{runtime.rel_exec_id}}/resume"
      headers:
        Content-Type: application/json
      body:
        resume_type: "continue"
    expect:
      status: 200

  # 等消费组确实把消息消费掉后再看状态，避免「还没被消费所以仍是 suspended」
  # 这种假通过。
  - name: "等待 continue 消息被消费（短路路径的 ack）"
    exec:
      command: sh -c 'sleep 5; echo consumed'
    expect:
      output:
        contains: "consumed"

  - name: "状态仍是 suspended（continue 不得终态化，执行仍可唤醒）"
    request:
      method: GET
      url: "http://localhost:18080/api/executions/{{runtime.rel_exec_id}}"
    expect:
      status: 200
      body:
        status: "suspended"

  - name: "retry 打在挂起执行上 → 同样幂等跳过（retry 只对 error 态断点有效）"
    request:
      method: POST
      url: "http://localhost:18080/api/executions/{{runtime.rel_exec_id}}/resume"
      headers:
        Content-Type: application/json
      body:
        resume_type: "retry"
    expect:
      status: 200

  - name: "等待 retry 消息被消费"
    exec:
      command: sh -c 'sleep 5; echo consumed'
    expect:
      output:
        contains: "consumed"

  - name: "状态仍是 suspended（retry 同样不得就地重跑挂起节点）"
    request:
      method: GET
      url: "http://localhost:18080/api/executions/{{runtime.rel_exec_id}}"
    expect:
      status: 200
      body:
        status: "suspended"

  # ── 真正的唤醒路径：event 决议 → 续跑至 completed ──────────────────────────

  - name: "event 决议恢复挂起审批（console resume 路径）"
    request:
      method: POST
      url: "http://localhost:18080/api/executions/{{runtime.rel_exec_id}}/resume"
      headers:
        Content-Type: application/json
      body:
        resume_type: "event"
        data:
          decision: "approved"
          approver: "e2e_user"
          comment: "e2e reliability approve"
    expect:
      status: 200

  - name: "审批流程续跑至完成（轮询）"
    request:
      method: GET
      url: "http://localhost:18080/api/executions/{{runtime.rel_exec_id}}"
    retry:
      maxAttempts: 20
      delay: 1s
    expect:
      status: 200
      body:
        status: "completed"

  # ── 终态幂等：已完成执行上的重复 resume 不改变终态 ─────────────────────────

  - name: "对 completed 终态重复 resume → 幂等跳过"
    request:
      method: POST
      url: "http://localhost:18080/api/executions/{{runtime.rel_exec_id}}/resume"
      headers:
        Content-Type: application/json
      body:
        resume_type: "event"
        data:
          decision: "approved"
    expect:
      status: 200

  - name: "终态未被重复 resume 改写"
    request:
      method: GET
      url: "http://localhost:18080/api/executions/{{runtime.rel_exec_id}}"
    expect:
      status: 200
      body:
        status: "completed"

  - name: "双 worker 注册可见（redis 注册表恰 2 个 flow_worker 实例）"
    exec:
      command: redis-cli --scan --pattern 'plaita:registry:flow_worker:*' | wc -l
    expect:
      output:
        contains: "2"

teardown:
  - name: "清理: 删除可靠性流程（容错）"
    request:
      method: DELETE
      url: http://localhost:18080/api/flows/e2e-rel-flow
      ignoreError: true
