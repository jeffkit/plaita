# 仅启动第三方依赖服务
# 用法: docker compose -f docker-compose.deps.yml up -d
#
# B59-02：Redis 只绑宿主回环（127.0.0.1），不暴露到局域网。Redis Commander
# 默认不启动——它是可对 Redis 执行任意命令的调试 UI，启用方式见
# docker-compose.redis-commander.yml（强制 HTTP 基本认证 + 回环绑定）。

services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: plaita-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
