services:
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: plaita-console/docker/Dockerfile.backend
    ports:
      - "18080:8080"
    environment:
      - LOKI_CONSOLE_REDIS_URL=redis://redis:6379/0
      - LOKI_CONSOLE_HOST=0.0.0.0
      - LOKI_CONSOLE_PORT=8080
      - LOKI_PROJECT_ROOT=/app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "15173:80"
    depends_on:
      - backend

volumes:
  redis_data:
