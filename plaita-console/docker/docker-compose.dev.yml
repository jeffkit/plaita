services:
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: plaita-console/docker/Dockerfile.backend
    ports:
      - "18080:8080"
    environment:
      - PLAITA_CONSOLE_REDIS_URL=redis://redis:6379/0
      - PLAITA_CONSOLE_HOST=0.0.0.0
      - PLAITA_CONSOLE_PORT=8080
      - PLAITA_PROJECT_ROOT=/app
      - PLAITA_CONSOLE_ADMIN_API_KEY=${PLAITA_CONSOLE_ADMIN_API_KEY:-dev-admin-key}
      - PLAITA_CONSOLE_SECRET_ID=${PLAITA_CONSOLE_SECRET_ID:-dev-id}
      - PLAITA_CONSOLE_SECRET_KEY=${PLAITA_CONSOLE_SECRET_KEY:-dev-secret}
      # 本地 compose 也可显式放开：PLAITA_CONSOLE_ALLOW_INSECURE_ADMIN=true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "15173:80"
    depends_on:
      - backend

volumes:
  redis_data:
