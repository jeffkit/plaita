
services:
  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Plaita Console Backend
  backend:
    build:
      context: ../..
      dockerfile: plaita-console/docker/Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - PLAITA_CONSOLE_REDIS_URL=redis://redis:6379/0
      - PLAITA_CONSOLE_HOST=0.0.0.0
      - PLAITA_CONSOLE_PORT=8080
      - PLAITA_PROJECT_ROOT=/app
      # 生产必须覆盖为强随机值；空密钥时管理 API / 契约接口 fail-closed
      - PLAITA_CONSOLE_ADMIN_API_KEY=${PLAITA_CONSOLE_ADMIN_API_KEY:-change-me-admin}
      - PLAITA_CONSOLE_SECRET_ID=${PLAITA_CONSOLE_SECRET_ID:-change-me-id}
      - PLAITA_CONSOLE_SECRET_KEY=${PLAITA_CONSOLE_SECRET_KEY:-change-me-secret}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Plaita Console Frontend
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Flow Worker (示例)
  flow-worker:
    build:
      context: ../..
      dockerfile: plaita-console/docker/Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: >
      python -m plaita.server.flow_worker
      --redis-url redis://redis:6379/0
      --queue-name plaita:flow:queue
      --execution-storage-type redis
      --flow-storage-type redis
      --enable-registry

volumes:
  redis_data:

