<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/plaita.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d12" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6f8" />
    <title>Plaita Console - 流程引擎管理台</title>
    <script>
      // 主题防闪烁：渲染前确定 data-theme（localStorage > 系统偏好 > 暗色）。
      // 字体为自托管（@fontsource），不再依赖 Google Fonts 外链。
      (function () {
        try {
          var t = localStorage.getItem('plaita-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
