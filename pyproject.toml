[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plaita"
version = "0.5.0"
description = "Official Python Runtime for Plaita -- Logic Compose Engine"
requires-python = ">=3.10"
authors = [
    { name = "Jeff kit", email = "bbmyth@gmail.com" },
]

dependencies = [
    "pydantic>=2.0",
    "pyparsing>=3.0",
    "isodate",
]

[project.optional-dependencies]
redis = ["redis>=4.0.0"]
server = [
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "python-multipart>=0.0.5",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "SQLAlchemy>=1.4.0",
    "cachetools>=5.0.0",
]
code = ["PyExecJS", "RestrictedPython>=7.0"]
http = ["requests", "aiohttp>=3.8.0"]
yaml = ["PyYAML>=6.0"]
dev = [
    "pytest",
    "pytest-asyncio",
    "fakeredis>=2.30.1",
    "pytest-cov",
    "mutmut>=3.6",
]
lint = [
    "mypy",
    "flake8",
    "black",
    "ruff>=0.6",
]
all = ["plaita[redis,server,code,http,yaml]"]

[project.urls]
Homepage = "https://jeffkit.github.io/plaita/"
Repository = "https://github.com/jeffkit/plaita"
Documentation = "https://jeffkit.github.io/plaita/"

[project.entry-points."plaita.nodes"]
delay = "plaita.server.nodes.delay_node:DelayNode"
redis_queue = "plaita.server.nodes.redis_queue_node:RedisQueueNode"
kafka_queue = "plaita.server.nodes.kafka_queue_node:KafkaQueueNode"
http_callback = "plaita.server.nodes.http_callback_node:HttpCallbackNode"
approval = "plaita.server.nodes.approval_node:ApprovalNode"

[tool.setuptools.packages.find]
include = ["plaita", "plaita.*"]
exclude = ["tests*", "examples*", "plaita-console*", "plaita_console*"]

# Ruff lint。``BLE001`` (blind-except) 设为 warn——``except Exception`` /
# ``except:`` 不带 ``logger``/``raise`` 的静默吞咽是本项目历史重灾区。新代码
# PR 拦截, 老位点随各文件整改逐步清理。E722 (bare except) 直接 error。
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E722", "BLE001"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# 测试代码允许 ``except Exception`` 兜底, 不强制记日志。
"tests/**" = ["BLE001"]

# 演示脚本、伴生文档与测试 fixture 不得进入 wheel——它们属于 examples/ 或 docs/。
# 即便有人误把 .md/.json/.txt 拖回 plaita/ 子包，这里也会拦下。
[tool.setuptools.exclude-package-data]
plaita = ["*.md", "*.json", "*.txt", "*demo*", "*example*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that exercise multiple components / optional backends (deselect with '-m \"not integration\"')",
    "e2e: marks end-to-end tests",
]

[tool.coverage.run]
# The gate measures core library logic reachable from `pytest tests/`.
# Omitted: optional backends needing live infra (redis/kafka/sqlalchemy/http
# services), demo/example scripts, and the remote client — these are covered
# by integration/E2E suites or separate extras, not the unit gate.
omit = [
  "plaita/storage/redis.py",
  "plaita/storage/sqlalchemy.py",
  "plaita/server/**",
  "plaita/node/redis.py",
  "plaita/node/http.py",
  "plaita/client.py",
  "plaita/event/demo_eventbus.py",
  "plaita/event/timeout.py",
  "plaita/event/redis.py",
  "plaita/event/sqlalchemy.py",
  "plaita/event/utils.py",
]

# 单元测试覆盖率门槛：当前 gate 范围（见 [tool.coverage.run] omit）整体 ≈ 80%
# （实测 79.8%）。门禁设在 79%——既能挡住明显回退，又给新增代码留一点波动空间。
# 目标：把整体覆盖拉到 85%+ 后，把 fail_under 上调到 80/85。
[tool.coverage.report]
fail_under = 79
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

# 变异测试 (mutmut 3.x)。完整背景、跑法、workaround 见 docs/mutation-testing.md。
# 基线范围: 纯同步、高覆盖率、无外部依赖的核心模块。async/distributed/timeout
# 路径 mutmut 并行模式跑不了 (pytest-asyncio 事件循环 + mutmut 进程内 pytest.main
# 冲突) —— 这些模块用 scripts/run_mutation_baseline.sh 逐变异点独立进程跑, 详见
# docs/mutation-testing.md §5。
[tool.mutmut]
source_paths = ["plaita"]
# 基线范围: 覆盖率高、纯逻辑、无外部依赖的核心模块。扩大基线时追加文件即可。
# 注意: 4+ 模块合并并行跑会触发 mutmut worker 长时复用挂起, 逐模块跑 (临时把
# only_mutate 改成单文件) 是已验证的可靠方式。
only_mutate = [
  "plaita/core/callback.py",
  "plaita/core/expression.py",
  "plaita/core/parallel_executor.py",
  "plaita/core/runner.py",
  "plaita/core/context.py",
  "plaita/node/calculate.py",
  "plaita/node/decide.py",
]
do_not_mutate = [
  "plaita/server/**",
  "plaita/storage/redis.py",
  "plaita/storage/sqlalchemy.py",
  "plaita/client.py",
  "plaita/event/demo_eventbus.py",
  "plaita/event/redis.py",
  "plaita/event/sqlalchemy.py",
  "tests/**",
  "examples/**",
]
mutate_only_covered_lines = true
pytest_add_cli_args = [
  "-m", "not integration and not e2e",
  "-q", "--no-header",
  "--ignore=tests/e2e",
  "--ignore=tests/integration",
  "--ignore=tests/test_concurrent.py",
]
# 并行模式只跑对应模块的「纯同步」测试; async 测试不纳入 (见上方说明)。
# async/distributed 模块 (executor/runner/concurrent) 的变异测试用
# scripts/run_mutation_baseline.sh 逐变异点独立进程跑, 见 docs §5。
pytest_add_cli_args_test_selection = [
  "tests/unit/test_callback.py",
  "tests/unit/test_run_forwards_callbacks.py",
  "tests/unit/test_child_callback_dedup.py",
  "tests/unit/test_expression.py",
  "tests/unit/test_expression_golden.py",
  "tests/unit/test_parallel_executor.py",
  "tests/unit/test_runner.py",
  "tests/unit/test_context.py",
  "tests/unit/test_calculate.py",
  "tests/unit/test_decide.py",
]
# 较短 timeout 是 workaround: mutmut worker 长时复用会假阳性误杀, 短 timeout
# 让 worker 周期性回收。代价: 末段少量变异点被误判 timeout, 用
# scripts/recheck_mutants.sh 复核。
timeout_multiplier = 12.0
timeout_constant = 2.0
