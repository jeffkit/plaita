# plaita 治理账本（governance ledger）
#
# 本文件是 plaita 仓的架构治理账本：跨平台引擎的合法 runtime 集与治理字段
# 以此为机器可读事实源。大仓根 `monarbor doctor` 经 docs/DOC_ASSERTIONS.yml
# 的 gov/* 断言（check: yaml_path_equals）逐条校验本文件。
#
# 维护约定：
#   * 增删引擎（改 runtime_valid_set）时，须同步 DOC_ASSERTIONS.yml 的
#     gov/runtime-valid-set 条目，并附对应平台仓的入位证据（commit 号）；
#   * owner / review_by 变更时，同步 gov/owner-not-tbd 与
#     gov/review-by-not-expired 两条断言的 expected；
#   * review_by 到期前须完成治理复审并顺延日期（断言按字面量比对，
#     只改本文件不改断言 expected 会红）；
#   * 新增/改声明节点（capability_matrix）时，跑
#     `python scripts/export_capability_matrix.py --check` 得差分，回写本表
#     并同步大仓根 DOC_ASSERTIONS.yml 的 gov/capability-matrix expected
#     （三处联动：注册表 ↔ 本表 ↔ 大仓断言；只改一处即红——注册表侧由
#     tests/unit/test_issue331_execution_profile.py 差分断言与本脚本
#     --check 拦截，本表侧由大仓断言拦截，#331 ⑤）。
#
# 来源：plaita#318（owner 亲提）；runtime_valid_set 与
# plaita/server/runtime_queues.py 的 VALID_RUNTIMES（r12 后实况）保持一致。

version: 1

gov:
  # 合法 runtime 集（多平台引擎）：python=本仓，go=plaita-go，rust=plaita-rs。
  runtime_valid_set: [go, python, rust]

  # 消息/定义的版本维度（plaita#328 收敛，F1）：只允许两个维度——
  #   wire_schema = 任务信封 schema_version（plaita/server/task_queue.py
  #                 TASK_SCHEMA_VERSION；唯一版本类死信路径 schema_too_new）；
  #   ir          = 定义 IR 契约代际（plaita/server/capability.py
  #                 ir_contract_version，能力清单）。
  # 新增版本维度须立 ADR 并附删除计划（#328 边界）。B2R31-01 的
  # config_family / config_generation / budget_generation / config_effective_at
  # 四个哈希维度已于 #328 删除（拓扑一致性改走 worker 启动校验；投递预算改
  # 为信封上的 max_deliveries 快照；tenant_generation 是身份字段不计入）。
  # 大仓根 DOC_ASSERTIONS.yml 可按 gov.version_dimensions 断言本集合。
  version_dimensions: [ir, wire_schema]

  # 治理 owner（不得为 TBD/占位符）。
  owner: jeffkit

  # 下次治理复审期限（ISO 日期字符串，须加引号避免被 YAML 解析为 date 类型，
  # 与 doctor 断言的字符串字面量比对口径一致）。
  review_by: '2027-01-31'

  # 自带注册面的执行台阶矩阵（plaita#331 ⑤ → 台阶化 2026-10-25；两语义终版见
  # docs/governance/execution-capabilities.md，两值台阶 inline/managed——
  # managed:queue 子档已废除，唤醒源在节点 wake_service 字段 + 点名闸）。
  # 事实源是注册表本身（plaita/node/capabilities.py
  # shipped_capability_matrix：内置 + 本仓 pyproject 声明的 plaita.nodes
  # entry points + opt-in code）；**inline 节点同样入列**——差分断言
  # 「注册表新增 node_type 而矩阵未变 → added 非空 → 红」靠全集覆盖。
  # 生成/校验：`python scripts/export_capability_matrix.py [--check|--json]`。
  capability_matrix:
    approval: managed
    assignment: inline
    case: inline
    child: inline
    code: inline
    delay: managed
    end: inline
    event: managed
    filter: inline
    find: inline
    http: inline
    http_callback: managed
    if: inline
    kafka_queue: managed
    loop: inline
    map: inline
    mock: inline
    parallel: inline
    redis_queue: managed
    reduce: inline
    reference: inline
    start: inline
    switch: inline
    while: inline
