<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <style>
      .class-box { fill: #f8f9fa; stroke: #2d3748; stroke-width: 2; }
      .class-header { fill: #4a5568; }
      .class-title { font-family: 'SF Mono', 'Monaco', monospace; font-size: 14px; font-weight: bold; fill: white; }
      .class-content { font-family: 'SF Mono', 'Monaco', monospace; font-size: 11px; fill: #2d3748; }
      .arrow { stroke: #4a5568; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #4a5568; }
      .arrow-diamond { fill: #4a5568; }
      .arrow-diamond-empty { fill: white; stroke: #4a5568; stroke-width: 1.5; }
      .arrow-triangle-empty { fill: white; stroke: #4a5568; stroke-width: 1.5; }
      .label { font-family: 'SF Mono', 'Monaco', monospace; font-size: 10px; fill: #718096; }
      .dashed { stroke-dasharray: 5,5; }
    </style>
  </defs>
  
  <!-- Flow Class -->
  <g transform="translate(40, 30)">
    <rect class="class-box" x="0" y="0" width="160" height="110" rx="4"/>
    <rect class="class-header" x="0" y="0" width="160" height="28" rx="4"/>
    <rect class="class-header" x="0" y="24" width="160" height="4"/>
    <text class="class-title" x="80" y="19" text-anchor="middle">Flow</text>
    <line x1="0" y1="55" x2="160" y2="55" stroke="#cbd5e0"/>
    <text class="class-content" x="10" y="45">+str flow_id</text>
    <text class="class-content" x="10" y="72">+List[Node] nodes</text>
    <text class="class-content" x="10" y="88">+start_node</text>
    <text class="class-content" x="10" y="104">+run()</text>
  </g>
  
  <!-- Node Class -->
  <g transform="translate(280, 30)">
    <rect class="class-box" x="0" y="0" width="180" height="95" rx="4"/>
    <rect class="class-header" x="0" y="0" width="180" height="28" rx="4"/>
    <rect class="class-header" x="0" y="24" width="180" height="4"/>
    <text class="class-title" x="90" y="19" text-anchor="middle">Node</text>
    <line x1="0" y1="55" x2="180" y2="55" stroke="#cbd5e0"/>
    <text class="class-content" x="10" y="45">+str id</text>
    <text class="class-content" x="10" y="72">+str type</text>
    <text class="class-content" x="10" y="88">+run(execution)</text>
  </g>
  
  <!-- FlowExecution Class -->
  <g transform="translate(40, 200)">
    <rect class="class-box" x="0" y="0" width="200" height="95" rx="4"/>
    <rect class="class-header" x="0" y="0" width="200" height="28" rx="4"/>
    <rect class="class-header" x="0" y="24" width="200" height="4"/>
    <text class="class-title" x="100" y="19" text-anchor="middle">FlowExecution</text>
    <line x1="0" y1="55" x2="200" y2="55" stroke="#cbd5e0"/>
    <text class="class-content" x="10" y="45">+dict context</text>
    <text class="class-content" x="10" y="72">+run(flow)</text>
    <text class="class-content" x="10" y="88">+_process_node(node)</text>
  </g>
  
  <!-- CallbackManager Class -->
  <g transform="translate(300, 200)">
    <rect class="class-box" x="0" y="0" width="180" height="110" rx="4"/>
    <rect class="class-header" x="0" y="0" width="180" height="28" rx="4"/>
    <rect class="class-header" x="0" y="24" width="180" height="4"/>
    <text class="class-title" x="90" y="19" text-anchor="middle">CallbackManager</text>
    <line x1="0" y1="55" x2="180" y2="55" stroke="#cbd5e0"/>
    <text class="class-content" x="10" y="45">+on_flow_start()</text>
    <text class="class-content" x="10" y="72">+on_node_start()</text>
    <text class="class-content" x="10" y="88">+on_node_end()</text>
    <text class="class-content" x="10" y="104">+on_flow_end()</text>
  </g>
  
  <!-- Subclasses: Start -->
  <g transform="translate(520, 30)">
    <rect class="class-box" x="0" y="0" width="100" height="45" rx="4"/>
    <rect class="class-header" x="0" y="0" width="100" height="28" rx="4"/>
    <rect class="class-header" x="0" y="24" width="100" height="4"/>
    <text class="class-title" x="50" y="19" text-anchor="middle">Start</text>
  </g>
  
  <!-- Subclasses: End -->
  <g transform="translate(630, 30)">
    <rect class="class-box" x="0" y="0" width="100" height="45" rx="4"/>
    <rect class="class-header" x="0" y="0" width="100" height="28" rx="4"/>
    <rect class="class-header" x="0" y="24" width="100" height="4"/>
    <text class="class-title" x="50" y="19" text-anchor="middle">End</text>
  </g>
  
  <!-- Subclasses: CustomNode -->
  <g transform="translate(575, 95)">
    <rect class="class-box" x="0" y="0" width="120" height="45" rx="4"/>
    <rect class="class-header" x="0" y="0" width="120" height="28" rx="4"/>
    <rect class="class-header" x="0" y="24" width="120" height="4"/>
    <text class="class-title" x="60" y="19" text-anchor="middle">CustomNode</text>
  </g>
  
  <!-- Arrows -->
  
  <!-- Flow contains Node (composition) -->
  <path class="arrow" d="M200,85 L260,85" marker-end="url(#arrow-diamond)"/>
  <polygon class="arrow-diamond" points="260,85 250,80 240,85 250,90"/>
  <text class="label" x="195" y="75">1</text>
  <text class="label" x="265" y="75">*</text>
  <text class="label" x="215" y="100">contains</text>
  
  <!-- FlowExecution executes Flow (dashed) -->
  <path class="arrow dashed" d="M140,200 L140,160 L120,160 L120,140"/>
  <polygon class="arrow-head" points="120,140 115,150 125,150"/>
  <text class="label" x="145" y="175">executes</text>
  
  <!-- FlowExecution notifies CallbackManager -->
  <path class="arrow" d="M240,247 L300,247"/>
  <polygon class="arrow-head" points="300,247 290,242 290,252"/>
  <text class="label" x="250" y="240">notifies</text>
  
  <!-- Node inheritance: Start -->
  <path class="arrow" d="M520,52 L480,52 L480,77 L460,77"/>
  <polygon class="arrow-triangle-empty" points="460,77 470,72 470,82"/>
  
  <!-- Node inheritance: End -->
  <path class="arrow" d="M630,52 L480,52"/>
  
  <!-- Node inheritance: CustomNode -->
  <path class="arrow" d="M575,117 L480,117 L480,77"/>
  
  <!-- Legend -->
  <g transform="translate(520, 200)">
    <rect fill="#f7fafc" stroke="#e2e8f0" x="0" y="0" width="220" height="130" rx="4"/>
    <text class="class-content" x="10" y="20" font-weight="bold">Legend</text>
    
    <line x1="10" y1="40" x2="50" y2="40" stroke="#4a5568" stroke-width="1.5"/>
    <polygon fill="#4a5568" points="50,40 40,35 40,45"/>
    <text class="class-content" x="60" y="44">Association</text>
    
    <line x1="10" y1="60" x2="50" y2="60" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5,5"/>
    <polygon fill="#4a5568" points="50,60 40,55 40,65"/>
    <text class="class-content" x="60" y="64">Dependency</text>
    
    <line x1="10" y1="80" x2="50" y2="80" stroke="#4a5568" stroke-width="1.5"/>
    <polygon fill="#4a5568" points="10,80 20,75 20,85"/>
    <text class="class-content" x="60" y="84">Composition</text>
    
    <line x1="10" y1="100" x2="50" y2="100" stroke="#4a5568" stroke-width="1.5"/>
    <polygon fill="white" stroke="#4a5568" stroke-width="1.5" points="50,100 40,95 40,105"/>
    <text class="class-content" x="60" y="104">Inheritance</text>
  </g>
</svg>

