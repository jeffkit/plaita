<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480">
  <defs>
    <style>
      .participant-box { fill: #e6fffa; stroke: #319795; stroke-width: 2; rx: 6; }
      .participant-text { font-family: 'SF Mono', 'Monaco', monospace; font-size: 12px; font-weight: bold; fill: #234e52; }
      .lifeline { stroke: #81e6d9; stroke-width: 1; stroke-dasharray: 6,4; }
      .activation { fill: #b2f5ea; stroke: #38b2ac; stroke-width: 1.5; }
      .message { stroke: #2c7a7b; stroke-width: 1.5; }
      .message-text { font-family: 'SF Mono', 'Monaco', monospace; font-size: 10px; fill: #234e52; }
      .return { stroke: #4fd1c5; stroke-width: 1.5; stroke-dasharray: 5,3; }
      .loop-box { fill: rgba(56, 178, 172, 0.1); stroke: #319795; stroke-width: 1.5; }
      .loop-label { fill: #319795; }
      .loop-text { font-family: 'SF Mono', 'Monaco', monospace; font-size: 10px; fill: white; font-weight: bold; }
      .note-box { fill: #fefcbf; stroke: #d69e2e; stroke-width: 1; }
      .note-text { font-family: 'SF Mono', 'Monaco', monospace; font-size: 9px; fill: #744210; }
      .title { font-family: 'SF Mono', 'Monaco', monospace; font-size: 16px; font-weight: bold; fill: #234e52; }
      .subtitle { font-family: 'SF Mono', 'Monaco', monospace; font-size: 11px; fill: #4a5568; }
    </style>
    <marker id="arrow-normal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c7a7b"/>
    </marker>
    <marker id="arrow-return-normal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fd1c5"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text class="title" x="350" y="25" text-anchor="middle">Normal Mode - Synchronous Execution</text>
  <text class="subtitle" x="350" y="42" text-anchor="middle">Complete execution in a single process, blocking until done</text>
  
  <!-- Participants -->
  <g transform="translate(50, 55)">
    <rect class="participant-box" x="0" y="0" width="90" height="32"/>
    <text class="participant-text" x="45" y="21" text-anchor="middle">Application</text>
  </g>
  
  <g transform="translate(200, 55)">
    <rect class="participant-box" x="0" y="0" width="110" height="32"/>
    <text class="participant-text" x="55" y="21" text-anchor="middle">FlowExecution</text>
  </g>
  
  <g transform="translate(380, 55)">
    <rect class="participant-box" x="0" y="0" width="80" height="32"/>
    <text class="participant-text" x="40" y="21" text-anchor="middle">Flow</text>
  </g>
  
  <g transform="translate(530, 55)">
    <rect class="participant-box" x="0" y="0" width="80" height="32"/>
    <text class="participant-text" x="40" y="21" text-anchor="middle">Node</text>
  </g>
  
  <!-- Lifelines -->
  <line class="lifeline" x1="95" y1="87" x2="95" y2="450"/>
  <line class="lifeline" x1="255" y1="87" x2="255" y2="450"/>
  <line class="lifeline" x1="420" y1="87" x2="420" y2="450"/>
  <line class="lifeline" x1="570" y1="87" x2="570" y2="450"/>
  
  <!-- Activations -->
  <rect class="activation" x="90" y="100" width="10" height="330"/>
  <rect class="activation" x="250" y="115" width="10" height="290"/>
  <rect class="activation" x="415" y="160" width="10" height="50"/>
  <rect class="activation" x="565" y="250" width="10" height="70"/>
  
  <!-- Note: Blocking call -->
  <rect class="note-box" x="15" y="110" width="60" height="40" rx="3"/>
  <text class="note-text" x="45" y="128" text-anchor="middle">Blocking</text>
  <text class="note-text" x="45" y="140" text-anchor="middle">Call</text>
  
  <!-- Messages -->
  
  <!-- App -> FlowExecution: run() -->
  <line class="message" x1="100" y1="120" x2="245" y2="120" marker-end="url(#arrow-normal)"/>
  <text class="message-text" x="155" y="115">flow.run(params)</text>
  
  <!-- FlowExecution: Initialize context -->
  <path class="message" d="M260,145 L295,145 L295,160 L260,160" marker-end="url(#arrow-normal)"/>
  <text class="message-text" x="300" y="155">clean() &amp; setup context</text>
  
  <!-- FlowExecution -> Flow: get start_node -->
  <line class="message" x1="260" y1="175" x2="410" y2="175" marker-end="url(#arrow-normal)"/>
  <text class="message-text" x="310" y="170">start_node</text>
  
  <!-- Flow -> FlowExecution: Node -->
  <line class="return" x1="415" y1="195" x2="265" y2="195" marker-end="url(#arrow-return-normal)"/>
  <text class="message-text" x="320" y="190">Start Node</text>
  
  <!-- Loop Box -->
  <rect class="loop-box" x="230" y="220" width="380" height="130" rx="3"/>
  <rect class="loop-label" x="230" y="220" width="75" height="16" rx="3"/>
  <text class="loop-text" x="240" y="231">loop</text>
  <text class="message-text" x="310" y="231">[while current_node exists]</text>
  
  <!-- FlowExecution -> Node: run(execution) -->
  <line class="message" x1="260" y1="260" x2="560" y2="260" marker-end="url(#arrow-normal)"/>
  <text class="message-text" x="380" y="255">node.run(execution)</text>
  
  <!-- Node: Execute logic -->
  <path class="message" d="M575,280 L605,280 L605,295 L575,295" marker-end="url(#arrow-normal)"/>
  <text class="message-text" x="610" y="290">Execute logic</text>
  
  <!-- Node -> FlowExecution: result -->
  <line class="return" x1="565" y1="310" x2="265" y2="310" marker-end="url(#arrow-return-normal)"/>
  <text class="message-text" x="400" y="305">result</text>
  
  <!-- FlowExecution: Update context -->
  <path class="message" d="M260,330 L295,330 L295,345 L260,345" marker-end="url(#arrow-normal)"/>
  <text class="message-text" x="300" y="340">Update $NODE context</text>
  
  <!-- End of loop, process result -->
  <path class="message" d="M260,370 L295,370 L295,385 L260,385" marker-end="url(#arrow-normal)"/>
  <text class="message-text" x="300" y="380">Process End node result</text>
  
  <!-- FlowExecution -> App: Final result -->
  <line class="return" x1="250" y1="405" x2="105" y2="405" marker-end="url(#arrow-return-normal)"/>
  <text class="message-text" x="155" y="400">Final Result</text>
  
  <!-- Key characteristics note -->
  <rect fill="#e6fffa" stroke="#319795" x="15" y="420" width="670" height="35" rx="4"/>
  <text class="message-text" x="25" y="435" font-weight="bold">Key Characteristics:</text>
  <text class="message-text" x="25" y="448">• Synchronous blocking call  • Single-threaded execution  • Complete result returned at once  • Best for quick flows</text>
</svg>

