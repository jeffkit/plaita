<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750">
  <defs>
    <linearGradient id="startGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="suspendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="resumeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="endGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowFlow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4B5563"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D97706"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7C3AED"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
    <marker id="arrowGreen2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1000" height="750" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E293B">断点续执完整执行流程</text>
  
  <!-- Phase labels -->
  <rect x="30" y="50" width="180" height="25" rx="4" fill="#C7D2FE" stroke="#A5B4FC" stroke-width="1"/>
  <text x="120" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3730A3">阶段一：流程启动</text>
  
  <rect x="230" y="50" width="180" height="25" rx="4" fill="#FDE68A" stroke="#FCD34D" stroke-width="1"/>
  <text x="320" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#92400E">阶段二：挂起等待</text>
  
  <rect x="430" y="50" width="180" height="25" rx="4" fill="#DDD6FE" stroke="#C4B5FD" stroke-width="1"/>
  <text x="520" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#5B21B6">阶段三：事件触发</text>
  
  <rect x="630" y="50" width="180" height="25" rx="4" fill="#BBF7D0" stroke="#86EFAC" stroke-width="1"/>
  <text x="720" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">阶段四：恢复执行</text>
  
  <rect x="830" y="50" width="140" height="25" rx="4" fill="#FECACA" stroke="#FCA5A5" stroke-width="1"/>
  <text x="900" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#991B1B">阶段五：完成</text>
  
  <!-- Swimlanes -->
  <line x1="20" y1="90" x2="980" y2="90" stroke="#CBD5E1" stroke-width="1"/>
  
  <rect x="20" y="95" width="100" height="30" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <text x="70" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">用户/客户端</text>
  <line x1="20" y1="125" x2="980" y2="125" stroke="#CBD5E1" stroke-width="1"/>
  
  <rect x="20" y="165" width="100" height="30" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <text x="70" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">FlowWorker</text>
  <line x1="20" y1="235" x2="980" y2="235" stroke="#CBD5E1" stroke-width="1"/>
  
  <rect x="20" y="275" width="100" height="30" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <text x="70" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">FlowExecution</text>
  <line x1="20" y1="345" x2="980" y2="345" stroke="#CBD5E1" stroke-width="1"/>
  
  <rect x="20" y="385" width="100" height="30" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <text x="70" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">EventNode</text>
  <line x1="20" y1="435" x2="980" y2="435" stroke="#CBD5E1" stroke-width="1"/>
  
  <rect x="20" y="475" width="100" height="30" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <text x="70" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">EventBus</text>
  <line x1="20" y1="525" x2="980" y2="525" stroke="#CBD5E1" stroke-width="1"/>
  
  <rect x="20" y="565" width="100" height="30" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <text x="70" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">外延服务</text>
  <line x1="20" y1="615" x2="980" y2="615" stroke="#CBD5E1" stroke-width="1"/>
  
  <rect x="20" y="655" width="100" height="30" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <text x="70" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">存储</text>
  <line x1="20" y1="705" x2="980" y2="705" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Phase 1: Start -->
  <!-- Step 1: User calls start_flow -->
  <rect x="130" y="135" width="100" height="30" rx="4" fill="url(#startGrad)" stroke="#047857" stroke-width="1"/>
  <text x="180" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">start_flow()</text>
  
  <path d="M 180 165 L 180 190" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#arrowFlow)"/>
  
  <!-- Step 2: FlowWorker receives request -->
  <rect x="130" y="195" width="100" height="30" rx="4" fill="url(#processGrad)" stroke="#1D4ED8" stroke-width="1"/>
  <text x="180" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">处理请求</text>
  
  <path d="M 180 225 L 180 280" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#arrowFlow)"/>
  
  <!-- Step 3: Run distributed -->
  <rect x="120" y="285" width="120" height="30" rx="4" fill="url(#processGrad)" stroke="#1D4ED8" stroke-width="1"/>
  <text x="180" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">run_distributed()</text>
  
  <path d="M 180 315 L 180 655" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#arrowFlow)"/>
  
  <!-- Step 4: Save initial state -->
  <rect x="130" y="660" width="100" height="30" rx="4" fill="#64748B" stroke="#475569" stroke-width="1"/>
  <text x="180" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">保存初始状态</text>
  
  <!-- Phase 2: Suspend -->
  <!-- Execute to EventNode -->
  <path d="M 240 300 L 280 300" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#arrowFlow)"/>
  
  <rect x="280" y="285" width="100" height="30" rx="4" fill="url(#processGrad)" stroke="#1D4ED8" stroke-width="1"/>
  <text x="330" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">执行节点</text>
  
  <path d="M 330 315 L 330 385" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#arrowFlow)"/>
  
  <!-- EventNode execute -->
  <rect x="280" y="390" width="100" height="30" rx="4" fill="url(#suspendGrad)" stroke="#B45309" stroke-width="1"/>
  <text x="330" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">execute()</text>
  
  <path d="M 330 420 L 330 475" stroke="#D97706" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  
  <!-- Subscribe event -->
  <rect x="270" y="480" width="120" height="30" rx="4" fill="url(#suspendGrad)" stroke="#B45309" stroke-width="1"/>
  <text x="330" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">register_subscription</text>
  
  <!-- Return pending status -->
  <path d="M 380 405 L 420 405 L 420 300 L 450 300" stroke="#D97706" stroke-width="2" stroke-dasharray="4,2" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="435" y="345" font-family="Arial, sans-serif" font-size="8" fill="#D97706">status: pending</text>
  
  <!-- Save suspended state -->
  <path d="M 330 510 L 330 655" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#arrowFlow)"/>
  
  <rect x="280" y="660" width="100" height="30" rx="4" fill="#64748B" stroke="#475569" stroke-width="1"/>
  <text x="330" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">保存挂起状态</text>
  
  <!-- Notify service -->
  <path d="M 390 495 L 420 495 L 420 565" stroke="#D97706" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  
  <rect x="400" y="570" width="80" height="30" rx="4" fill="url(#suspendGrad)" stroke="#B45309" stroke-width="1"/>
  <text x="440" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">处理任务</text>
  
  <!-- Phase 3: Event Trigger -->
  <!-- Waiting... -->
  <text x="530" y="590" font-family="Arial, sans-serif" font-size="10" fill="#64748B" font-style="italic">等待外部条件...</text>
  
  <!-- External condition met -->
  <rect x="580" y="570" width="100" height="30" rx="4" fill="url(#resumeGrad)" stroke="#6D28D9" stroke-width="1"/>
  <text x="630" y="587" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">条件满足</text>
  <text x="630" y="597" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">触发事件</text>
  
  <path d="M 480 585 L 578 585" stroke="#64748B" stroke-width="2" stroke-dasharray="4,2" fill="none" marker-end="url(#arrowFlow)"/>
  
  <!-- Publish event -->
  <path d="M 630 570 L 630 510" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>
  
  <rect x="580" y="480" width="100" height="30" rx="4" fill="url(#resumeGrad)" stroke="#6D28D9" stroke-width="1"/>
  <text x="630" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">publish(event)</text>
  
  <!-- Match subscription -->
  <path d="M 680 495 L 720 495 L 720 475" stroke="#7C3AED" stroke-width="2" fill="none"/>
  <text x="700" y="525" font-family="Arial, sans-serif" font-size="8" fill="#7C3AED">匹配订阅</text>
  
  <!-- Phase 4: Resume -->
  <!-- Notify FlowWorker -->
  <path d="M 720 475 L 720 215 L 760 215" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>
  
  <rect x="760" y="195" width="100" height="30" rx="4" fill="url(#resumeGrad)" stroke="#6D28D9" stroke-width="1"/>
  <text x="810" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">resume_flow()</text>
  
  <!-- Load state -->
  <path d="M 810 225 L 810 655" stroke="#64748B" stroke-width="2" stroke-dasharray="4,2" fill="none" marker-end="url(#arrowFlow)"/>
  <text x="825" y="595" font-family="Arial, sans-serif" font-size="8" fill="#64748B">加载状态</text>
  
  <rect x="760" y="660" width="100" height="30" rx="4" fill="#64748B" stroke="#475569" stroke-width="1"/>
  <text x="810" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">加载上下文</text>
  
  <!-- Handle resume -->
  <path d="M 810 235 L 810 280" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>
  
  <rect x="745" y="285" width="130" height="30" rx="4" fill="url(#resumeGrad)" stroke="#6D28D9" stroke-width="1"/>
  <text x="810" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">handle_resume_operation</text>
  
  <!-- Call on_event -->
  <path d="M 810 315 L 810 385" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>
  
  <rect x="760" y="390" width="100" height="30" rx="4" fill="url(#resumeGrad)" stroke="#6D28D9" stroke-width="1"/>
  <text x="810" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">on_event()</text>
  
  <!-- Continue execution -->
  <path d="M 860 405 L 890 405 L 890 300 L 910 300" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrowGreen2)"/>
  <text x="890" y="355" font-family="Arial, sans-serif" font-size="8" fill="#059669">继续执行</text>
  
  <!-- Phase 5: End -->
  <rect x="910" y="285" width="70" height="30" rx="4" fill="url(#endGrad)" stroke="#B91C1C" stroke-width="1"/>
  <text x="945" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">后续节点</text>
  
  <path d="M 945 315 L 945 380" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  
  <circle cx="945" cy="405" r="20" fill="url(#endGrad)" stroke="#991B1B" stroke-width="2"/>
  <text x="945" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">END</text>
  
  <!-- Save completed state -->
  <path d="M 945 425 L 945 655" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#arrowFlow)"/>
  
  <rect x="895" y="660" width="100" height="30" rx="4" fill="#64748B" stroke="#475569" stroke-width="1"/>
  <text x="945" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">保存完成状态</text>
  
  <!-- Return to user -->
  <path d="M 945 280 L 945 165" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrowGreen2)"/>
  
  <rect x="895" y="135" width="100" height="30" rx="4" fill="url(#startGrad)" stroke="#047857" stroke-width="1"/>
  <text x="945" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">返回结果</text>
  
  <!-- Legend -->
  <rect x="30" y="715" width="940" height="30" rx="4" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <text x="50" y="735" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E293B">图例：</text>
  
  <rect x="90" y="723" width="30" height="14" rx="2" fill="#10B981" stroke="#059669" stroke-width="1"/>
  <text x="128" y="735" font-family="Arial, sans-serif" font-size="9" fill="#1E293B">启动/完成</text>
  
  <rect x="200" y="723" width="30" height="14" rx="2" fill="#3B82F6" stroke="#2563EB" stroke-width="1"/>
  <text x="238" y="735" font-family="Arial, sans-serif" font-size="9" fill="#1E293B">执行处理</text>
  
  <rect x="310" y="723" width="30" height="14" rx="2" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>
  <text x="348" y="735" font-family="Arial, sans-serif" font-size="9" fill="#1E293B">挂起等待</text>
  
  <rect x="420" y="723" width="30" height="14" rx="2" fill="#8B5CF6" stroke="#7C3AED" stroke-width="1"/>
  <text x="458" y="735" font-family="Arial, sans-serif" font-size="9" fill="#1E293B">事件恢复</text>
  
  <rect x="530" y="723" width="30" height="14" rx="2" fill="#EF4444" stroke="#DC2626" stroke-width="1"/>
  <text x="568" y="735" font-family="Arial, sans-serif" font-size="9" fill="#1E293B">结束</text>
  
  <rect x="620" y="723" width="30" height="14" rx="2" fill="#64748B" stroke="#475569" stroke-width="1"/>
  <text x="658" y="735" font-family="Arial, sans-serif" font-size="9" fill="#1E293B">存储操作</text>
  
  <line x1="730" y1="730" x2="780" y2="730" stroke="#64748B" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="788" y="735" font-family="Arial, sans-serif" font-size="9" fill="#1E293B">异步/等待</text>
</svg>
