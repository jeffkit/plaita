<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 580">
  <defs>
    <style>
      .participant-box { fill: #faf5ff; stroke: #805ad5; stroke-width: 2; rx: 6; }
      .participant-text { font-family: 'PingFang SC', 'Microsoft YaHei', 'SF Mono', monospace; font-size: 12px; font-weight: bold; fill: #44337a; }
      .lifeline { stroke: #d6bcfa; stroke-width: 1; stroke-dasharray: 6,4; }
      .activation { fill: #e9d8fd; stroke: #9f7aea; stroke-width: 1.5; }
      .message { stroke: #6b46c1; stroke-width: 1.5; }
      .message-text { font-family: 'PingFang SC', 'Microsoft YaHei', 'SF Mono', monospace; font-size: 10px; fill: #44337a; }
      .return { stroke: #b794f4; stroke-width: 1.5; stroke-dasharray: 5,3; }
      .loop-box { fill: rgba(128, 90, 213, 0.1); stroke: #805ad5; stroke-width: 1.5; }
      .loop-label { fill: #805ad5; }
      .loop-text { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 10px; fill: white; font-weight: bold; }
      .alt-box { fill: rgba(237, 137, 54, 0.1); stroke: #dd6b20; stroke-width: 1.5; }
      .alt-label { fill: #dd6b20; }
      .note-box { fill: #fed7e2; stroke: #d53f8c; stroke-width: 1; }
      .note-text { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 9px; fill: #702459; }
      .title { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 16px; font-weight: bold; fill: #44337a; }
      .subtitle { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 11px; fill: #4a5568; }
      .yield-text { font-family: 'PingFang SC', 'Microsoft YaHei', 'SF Mono', monospace; font-size: 10px; fill: #d53f8c; font-weight: bold; }
    </style>
    <marker id="arrow-gen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b46c1"/>
    </marker>
    <marker id="arrow-return-gen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b794f4"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text class="title" x="375" y="25" text-anchor="middle">Generator 模式 - 单步执行</text>
  <text class="subtitle" x="375" y="42" text-anchor="middle">每个节点执行后交出控制权，适用于调试和单步执行</text>
  
  <!-- Participants -->
  <g transform="translate(40, 55)">
    <rect class="participant-box" x="0" y="0" width="100" height="32"/>
    <text class="participant-text" x="50" y="21" text-anchor="middle">调试器/应用</text>
  </g>
  
  <g transform="translate(200, 55)">
    <rect class="participant-box" x="0" y="0" width="110" height="32"/>
    <text class="participant-text" x="55" y="21" text-anchor="middle">FlowExecution</text>
  </g>
  
  <g transform="translate(380, 55)">
    <rect class="participant-box" x="0" y="0" width="80" height="32"/>
    <text class="participant-text" x="40" y="21" text-anchor="middle">Flow</text>
  </g>
  
  <g transform="translate(530, 55)">
    <rect class="participant-box" x="0" y="0" width="80" height="32"/>
    <text class="participant-text" x="40" y="21" text-anchor="middle">Node</text>
  </g>
  
  <g transform="translate(650, 55)">
    <rect class="participant-box" x="0" y="0" width="80" height="32"/>
    <text class="participant-text" x="40" y="21" text-anchor="middle">生成器</text>
  </g>
  
  <!-- Lifelines -->
  <line class="lifeline" x1="90" y1="87" x2="90" y2="540"/>
  <line class="lifeline" x1="255" y1="87" x2="255" y2="540"/>
  <line class="lifeline" x1="420" y1="87" x2="420" y2="540"/>
  <line class="lifeline" x1="570" y1="87" x2="570" y2="540"/>
  <line class="lifeline" x1="690" y1="87" x2="690" y2="540"/>
  
  <!-- Activations -->
  <rect class="activation" x="85" y="100" width="10" height="420"/>
  <rect class="activation" x="250" y="115" width="10" height="50"/>
  <rect class="activation" x="685" y="140" width="10" height="380"/>
  <rect class="activation" x="250" y="195" width="10" height="100"/>
  <rect class="activation" x="565" y="240" width="10" height="40"/>
  <rect class="activation" x="250" y="360" width="10" height="100"/>
  <rect class="activation" x="565" y="400" width="10" height="40"/>
  
  <!-- Messages -->
  
  <!-- App -> FlowExecution: debug() -->
  <line class="message" x1="95" y1="120" x2="245" y2="120" marker-end="url(#arrow-gen)"/>
  <text class="message-text" x="145" y="115">flow.debug(params)</text>
  
  <!-- FlowExecution -> Generator: create generator -->
  <line class="message" x1="260" y1="145" x2="680" y2="145" marker-end="url(#arrow-gen)"/>
  <text class="message-text" x="420" y="140">_run(flow, lazy=True)</text>
  
  <!-- Generator -> App: generator object -->
  <line class="return" x1="685" y1="165" x2="100" y2="165" marker-end="url(#arrow-return-gen)"/>
  <text class="message-text" x="350" y="160">生成器对象</text>
  
  <!-- First Loop Box -->
  <rect class="loop-box" x="65" y="180" width="590" height="150" rx="3"/>
  <rect class="loop-label" x="65" y="180" width="75" height="16" rx="3"/>
  <text class="loop-text" x="75" y="191">循环</text>
  <text class="message-text" x="145" y="191">[每一步 - 由调用方控制]</text>
  
  <!-- App -> FlowExecution: next() -->
  <line class="message" x1="95" y1="210" x2="245" y2="210" marker-end="url(#arrow-gen)"/>
  <text class="message-text" x="155" y="205">next(generator)</text>
  
  <!-- FlowExecution -> Flow: next_node() -->
  <line class="message" x1="260" y1="230" x2="415" y2="230" marker-end="url(#arrow-gen)"/>
  <text class="message-text" x="320" y="225">next_node()</text>
  
  <!-- FlowExecution -> Node: run() -->
  <line class="message" x1="260" y1="250" x2="560" y2="250" marker-end="url(#arrow-gen)"/>
  <text class="message-text" x="380" y="245">node.run()</text>
  
  <!-- Node -> FlowExecution: result -->
  <line class="return" x1="565" y1="275" x2="265" y2="275" marker-end="url(#arrow-return-gen)"/>
  <text class="message-text" x="400" y="270">结果</text>
  
  <!-- Yield note -->
  <rect class="note-box" x="270" y="290" width="120" height="30" rx="3"/>
  <text class="yield-text" x="330" y="310" text-anchor="middle">yield 步骤结果</text>
  
  <!-- FlowExecution -> App: step result -->
  <line class="return" x1="250" y1="315" x2="100" y2="315" marker-end="url(#arrow-return-gen)"/>
  <text class="message-text" x="155" y="310">{id, type, result, context}</text>
  
  <!-- Second iteration indication -->
  <text class="message-text" x="70" y="345" fill="#805ad5" font-style="italic">... 调用方可检查、修改、继续 ...</text>
  
  <!-- App -> FlowExecution: next() again -->
  <line class="message" x1="95" y1="375" x2="245" y2="375" marker-end="url(#arrow-gen)"/>
  <text class="message-text" x="155" y="370">next(generator)</text>
  
  <!-- FlowExecution -> Node: run() -->
  <line class="message" x1="260" y1="410" x2="560" y2="410" marker-end="url(#arrow-gen)"/>
  <text class="message-text" x="380" y="405">node.run()</text>
  
  <!-- Node -> FlowExecution: result -->
  <line class="return" x1="565" y1="435" x2="265" y2="435" marker-end="url(#arrow-return-gen)"/>
  <text class="message-text" x="400" y="430">结果</text>
  
  <!-- Yield end result -->
  <rect class="note-box" x="270" y="450" width="145" height="30" rx="3"/>
  <text class="yield-text" x="342" y="470" text-anchor="middle">yield 结束结果 (is_end=True)</text>
  
  <!-- FlowExecution -> App: final result -->
  <line class="return" x1="250" y1="495" x2="100" y2="495" marker-end="url(#arrow-return-gen)"/>
  <text class="message-text" x="155" y="490">{result, is_end: true}</text>
  
  <!-- Key characteristics note -->
  <rect fill="#faf5ff" stroke="#805ad5" x="15" y="520" width="720" height="35" rx="4"/>
  <text class="message-text" x="25" y="535" font-weight="bold">主要特点：</text>
  <text class="message-text" x="25" y="548">• Python 生成器模式  • 调用方控制执行节奏  • 步骤间可检查状态  • 适用于调试和单步执行</text>
</svg>
