<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <defs>
    <linearGradient id="flowExecGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3730A3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eventSysGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="storageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B45309;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4B5563"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="900" height="650" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E293B">断点续执（Checkpoint）架构总览</text>
  
  <!-- Layer 1: Flow Execution -->
  <rect x="40" y="60" width="820" height="110" rx="8" fill="url(#flowExecGrad)" stroke="#312E81" stroke-width="2"/>
  <text x="60" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">流程执行层 (Flow Execution)</text>
  
  <rect x="60" y="100" width="780" height="55" rx="5" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="80" y="122" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">FlowExecution</text>
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="11" fill="white">• run_distributed() - 分布式执行</text>
  <text x="300" y="140" font-family="Arial, sans-serif" font-size="11" fill="white">• _handle_resume_operation() - 恢复处理</text>
  <text x="580" y="140" font-family="Arial, sans-serif" font-size="11" fill="white">• _subscribe_event() - 事件订阅</text>

  <!-- Arrow 1 -->
  <path d="M 450 170 L 450 195" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Layer 2: Event System -->
  <rect x="40" y="200" width="820" height="110" rx="8" fill="url(#eventSysGrad)" stroke="#064E3B" stroke-width="2"/>
  <text x="60" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">事件系统层 (Event System)</text>
  
  <rect x="60" y="240" width="240" height="55" rx="5" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="180" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">EventBus</text>
  <text x="180" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">publish / subscribe</text>
  
  <rect x="320" y="240" width="240" height="55" rx="5" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="440" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">EventStorage</text>
  <text x="440" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">store / get / list</text>
  
  <rect x="580" y="240" width="260" height="55" rx="5" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="710" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">SubscriptionStorage</text>
  <text x="710" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">register / match / unregister</text>

  <!-- Arrow 2 -->
  <path d="M 450 310 L 450 335" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Layer 3: State Storage -->
  <rect x="40" y="340" width="820" height="110" rx="8" fill="url(#storageGrad)" stroke="#7F1D1D" stroke-width="2"/>
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">状态存储层 (State Storage)</text>
  
  <rect x="60" y="380" width="250" height="55" rx="5" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="185" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">ExecutionStorage</text>
  <text x="185" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">save / load / delete state</text>
  
  <rect x="330" y="380" width="230" height="55" rx="5" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="445" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">FlowStorage</text>
  <text x="445" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">get / save flow definition</text>
  
  <rect x="580" y="380" width="260" height="55" rx="5" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="710" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Context Data</text>
  <text x="710" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">序列化执行上下文</text>

  <!-- Arrow 3 -->
  <path d="M 450 450 L 450 475" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Layer 4: Extended Services -->
  <rect x="40" y="480" width="820" height="110" rx="8" fill="url(#serviceGrad)" stroke="#78350F" stroke-width="2"/>
  <text x="60" y="505" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">外延服务层 (Extended Services)</text>
  
  <rect x="60" y="520" width="180" height="55" rx="5" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="150" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">DelayService</text>
  <text x="150" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">定时延迟</text>
  
  <rect x="260" y="520" width="180" height="55" rx="5" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="350" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">RedisQueueService</text>
  <text x="350" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Redis 消息队列</text>
  
  <rect x="460" y="520" width="180" height="55" rx="5" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="550" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">KafkaQueueService</text>
  <text x="550" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Kafka 消息队列</text>
  
  <rect x="660" y="520" width="180" height="55" rx="5" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="750" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">HttpCallbackService</text>
  <text x="750" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">HTTP 回调</text>

  <!-- Right side: FlowWorker -->
  <rect x="700" y="60" width="150" height="100" rx="8" fill="#7C3AED" stroke="#5B21B6" stroke-width="2"/>
  <text x="775" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">FlowWorker</text>
  <text x="775" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• start_flow()</text>
  <text x="775" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• resume_flow()</text>
  <text x="775" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 监听事件</text>

  <!-- Legend -->
  <rect x="40" y="605" width="820" height="35" rx="5" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <text x="60" y="628" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E293B">存储后端支持：</text>
  <rect x="180" y="615" width="12" height="12" fill="#10B981" stroke="#059669" stroke-width="1"/>
  <text x="198" y="627" font-family="Arial, sans-serif" font-size="11" fill="#1E293B">Memory</text>
  <rect x="270" y="615" width="12" height="12" fill="#EF4444" stroke="#DC2626" stroke-width="1"/>
  <text x="288" y="627" font-family="Arial, sans-serif" font-size="11" fill="#1E293B">Redis</text>
  <rect x="350" y="615" width="12" height="12" fill="#3B82F6" stroke="#2563EB" stroke-width="1"/>
  <text x="368" y="627" font-family="Arial, sans-serif" font-size="11" fill="#1E293B">SQLAlchemy (PostgreSQL/MySQL/SQLite)</text>
</svg>
