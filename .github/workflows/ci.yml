name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plaita-ai:
    name: plaita-ai (MCP/CLI/agents)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plaita + plaita-ai
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e "plaita-ai[dev]"
          # 真实 mcp 导入冒烟：历史上被 sys.modules stub 掩盖（mcp 2.x 即坏）
          python -c "from mcp.server.fastmcp import FastMCP; print('FastMCP OK')"
      - name: pytest plaita-ai
        run: python -m pytest plaita-ai/tests -q

  gate:
    name: Regression gate (py${{ matrix.python-version }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.12/3.13 为 2026-09 版本矩阵评审补充：本机验证一直在 3.13、CI 只测
        # 3.10，中间版本从未被任何环境覆盖
        # 单腿消元实验：验证 matrix 并发是否为停滞触发器（结论后恢复三腿）
        python-version: ["3.12"]
    # 钉 ubuntu-24.04：2026-10-01 起 ubuntu-latest 镜像漂移导致回归门 pytest
    # 步三腿同步停滞（35min 超时，纯 main 可复现），钉版本隔离镜像变量。
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # 不开 cache: pip——2026-10-01 三腿回归门停滞排查：同 workflow 无
          # cache 无 matrix 的 plaita-ai 腿一直绿，矩阵腿必停（runner 心跳在、
          # 日志 blob 从未上传、纯 main 可复现、本地 mac/linux 断网全量 70s
          # 绿=套件无网络依赖无挂点）。首个对齐变量就是 pip cache（restore/
          # save 大环境）；ubuntu-24.04 钉版未能修复，逐变量消元。
          # cache: pip

      - name: Install package + gate deps
        run: |
          python -m pip install --upgrade pip
          # Gate 会 collect/跑到 optional 后端与节点路径（redis/sqlalchemy/http/code/server）。
          # 用 all 一次装齐，避免缺 extra 时在 collection/首个用例上连环红。
          # aiosqlite 已含在 sqlalchemy extra；cachetools 已含在 server extra。
          # pytest-timeout：门禁挂死时 150s 内把「卡住的测试」变成带堆栈的快速红
          # （2026-10-01 回归门三腿停滞、日志全黑的教训），并给出 durations 排慢。
          pip install -e ".[dev,lint,all]" pytest-timeout
          pip install build wheel

      - name: Ruff E722 (bare except — hard fail)
        run: ruff check plaita tests --select E722

      # BLE001 历史位点多，按 MIGRATION.md 约定仅 warn、逐步清理；
      # 不能把存量 except Exception 当成硬门禁，否则 main 永远红。
      - name: Ruff BLE001 (blind except — warn only)
        run: ruff check plaita tests --select BLE001 --exit-zero

      # 拆步诊断：停滞只知「卡在 gate 大步内」，拆成 4 相位让 steps API
      # 暴露卡点阶段（ci-gate.sh 支持相位参数；本地四相位全绿）
      - name: CI gate [1/4] pytest + coverage
        run: bash scripts/ci-gate.sh pytest
      - name: CI gate [2/4] import layering
        run: bash scripts/ci-gate.sh layering
      - name: CI gate [3/4] wheel contents
        run: bash scripts/ci-gate.sh wheel
      - name: CI gate [4/4] module size SC-003
        run: bash scripts/ci-gate.sh size
