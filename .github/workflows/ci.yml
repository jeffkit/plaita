name: CI

# 路径过滤（2026-10-23 CI 卫生轮）：纯文档 push 不触发门禁。
#
# 背景：10-21 起 main 的 108 个 first-parent 提交里 98 个只动台账/docs，
# 每个都占一台 runner、且因 concurrency.cancel-in-progress 把 1 分钟前
# 刚起跑的**代码** CI 取消掉（03:25 B4 r12 合并的 CI 就是被紧随的台账
# push 掐死的）——门禁判决被噪音淹没。
#
# 用 paths 带 `!` 负模式而非 paths-ignore：paths-ignore 不支持再纳入，
# 而 docs/ 下有 5 份文件是单测的输入（文档↔代码契约），改它们必须跑门：
#   docs/DOC_CODE_MAP.md            ← test_issue132_doc_code_map / test_docs_extras_sync
#   docs/event-USER_GUIDE.md        ← test_docs_event_public_names
#   docs/event-ARCHITECTURE.md      ← test_docs_event_public_names
#   docs/mutation-testing.md        ← test_issue125_mutation_config
#   docs/issue69-mutation-matrix.md ← test_issue69_r11_instance_state_generalisation
# 新增「读 docs/ 文件」的测试时同步登记到这里（push 与 pull_request 两处
# + ci-slow.yml 同款）。docs-site/** 与 MIGRATION.md 也被测试消费，不排除。
# 模式顺序有语义：后面的负模式排除前面的正匹配，再后面的正模式重新纳入。

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "docs/DOC_CODE_MAP.md"
      - "docs/event-USER_GUIDE.md"
      - "docs/event-ARCHITECTURE.md"
      - "docs/mutation-testing.md"
      - "docs/issue69-mutation-matrix.md"
      - "!duo-*-ledger.md"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "docs/DOC_CODE_MAP.md"
      - "docs/event-USER_GUIDE.md"
      - "docs/event-ARCHITECTURE.md"
      - "docs/mutation-testing.md"
      - "docs/issue69-mutation-matrix.md"
      - "!duo-*-ledger.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plaita-ai:
    name: plaita-ai (MCP/CLI/agents)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install plaita + plaita-ai
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e "plaita-ai[dev]"
          # 真实 mcp 导入冒烟：历史上被 sys.modules stub 掩盖（mcp 2.x 即坏）
          python -c "from mcp.server.fastmcp import FastMCP; print('FastMCP OK')"
      - name: pytest plaita-ai
        run: python -m pytest plaita-ai/tests -q

  console-frontend-contracts:
    name: Console frontend contracts (#266 / S17)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # check-api-transport.mjs 直接 import .ts（行为断言）；类型擦除需
          # Node ≥22.18，不能依赖 gate 容器里的系统 nodejs。
          node-version: "22.18"
      # #266：源码/README 不得再出现浏览器管理密钥通道
      # S17：传输层行为（超时/非 JSON/SPA 兜底/retry/终态）+ 出货接线
      # A2R40-01/#276：数据面 Redis 读面契约（前端采 data_plane_*/warnings）
      - name: Admin key + transport contracts
        run: |
          node plaita-console/frontend/scripts/check-admin-key.mjs
          node plaita-console/frontend/scripts/check-api-transport.mjs
          node plaita-console/frontend/scripts/check-cluster-dataplane.mjs

  console-backend:
    name: Console backend regression (#260-#265)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install plaita + console backend deps
        run: |
          python -m pip install --upgrade pip
          # A59-02：console 后端依赖与根 extras 不同面——sse-starlette / httpx /
          # alembic / python-multipart / pydantic-ai / ag-ui-protocol 只在
          # plaita-console/backend/requirements.txt 里声明。
          python -m pip install -e ".[dev,lint,all]" \
            -r plaita-console/backend/requirements.txt pytest-timeout

      # A59-02：plaita-console/backend/tests（94 文件 / 773 用例）是 #260-#263
      # 回归所在，此前 ci.yml 不收集（只在本地/console E2E 覆盖）。按根 tests
      # 同款三分块串跑：块间进程隔离，每块独立重试 3 次。
      - name: Console backend [1/3] chunk A
        run: |
          attempt=1
          until find plaita-console/backend/tests/console -name 'test_*.py' | sort | awk 'NR % 3 == 0' | tr '\n' '\0' | xargs -0 \
            python -m pytest --timeout=150 --timeout-method=thread -m "not slow" -x -q; do
            if [ $attempt -ge 3 ]; then echo "chunk failed 3 attempts"; exit 1; fi
            attempt=$((attempt+1)); echo "== retry attempt $attempt =="; sleep 10
          done
      - name: Console backend [2/3] chunk B
        run: |
          attempt=1
          until find plaita-console/backend/tests/console -name 'test_*.py' | sort | awk 'NR % 3 == 1' | tr '\n' '\0' | xargs -0 \
            python -m pytest --timeout=150 --timeout-method=thread -m "not slow" -x -q; do
            if [ $attempt -ge 3 ]; then echo "chunk failed 3 attempts"; exit 1; fi
            attempt=$((attempt+1)); echo "== retry attempt $attempt =="; sleep 10
          done
      - name: Console backend [3/3] chunk C
        run: |
          attempt=1
          until find plaita-console/backend/tests/console -name 'test_*.py' | sort | awk 'NR % 3 == 2' | tr '\n' '\0' | xargs -0 \
            python -m pytest --timeout=150 --timeout-method=thread -m "not slow" -x -q; do
            if [ $attempt -ge 3 ]; then echo "chunk failed 3 attempts"; exit 1; fi
            attempt=$((attempt+1)); echo "== retry attempt $attempt =="; sleep 10
          done
      # 具名快速信号：分块若因前缀失败未跑到，这里仍把 #260-#263 的回归
      # 变成可见步骤（与根 gate 的 [1e/6] DSL conformance 同策略）。
      - name: Console backend [named] issue #260-#263 regression
        run: |
          python -m pytest \
            plaita-console/backend/tests/console/test_issue260_platform_account_guard.py \
            plaita-console/backend/tests/console/test_issue261_cluster_platform_admin.py \
            plaita-console/backend/tests/console/test_issue262_dispatch_authoritative.py \
            plaita-console/backend/tests/console/test_issue263_cluster_read_surface_gate.py \
            plaita-console/backend/tests/console/test_issue263_dispatch_ledger_tenant_scope.py \
            -x -q

  # 插件门控子集（2026-10-23 CI 卫生轮）：flow 定义含 plaita-nodes 节点
  # （sql_query 等）的用例在 console-backend 环境里一律 skip（节点未注册 →
  # save 过 Python schema 层即 422，到不了能力门；同一根因三次推红 main：
  # r80 / r93 / B4 r12）。这里**单开环境**装插件把它们真跑起来——不装进
  # console-backend 三分块：主 suite 的 registry/可用节点清单保持原样，
  # 既有快照断言不受扰。
  console-backend-plugins:
    name: Console backend + plaita-nodes (requires_plaita_nodes 子集)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      # plaita-nodes 钉 PyPI 发布件（公开仓亦可 git+ 装，发布件更稳、免 clone）。
      # 其 `plaita>=0.5.0` 由前一步 editable 的本 checkout 满足，resolver 不会
      # 把 plaita 换成 PyPI 版；agentproc/requests 随其约束浮动（本地核过的
      # 组合：plaita-nodes 0.8.0 × agentproc 0.20.0 × plaita 0.63）。升 pin 前
      # 本地 venv 复跑 -m requires_plaita_nodes 子集。
      - name: Install plaita + console backend deps + plaita-nodes (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lint,all]" \
            -r plaita-console/backend/requirements.txt pytest-timeout
          python -m pip install "plaita-nodes==0.8.0"
      # 守卫：装失败 / 入口点缺失 / 导入链断（如 agentproc 漂移）时，下一步
      # 会把子集整体 skip 成「空心绿」或 422 假象——这里显式带 traceback 红。
      - name: Assert sql_query entry point present and loadable
        run: |
          python - <<'EOF'
          from importlib.metadata import entry_points
          eps = {ep.name: ep for ep in entry_points(group="plaita.nodes")}
          assert "sql_query" in eps, f"sql_query entry point missing; have {sorted(eps)}"
          cls = eps["sql_query"].load()
          print(f"sql_query -> {cls.__module__}.{cls.__name__}; {len(eps)} plaita.nodes entry points")
          EOF
      # 子集 = 全部贴了 requires_plaita_nodes 的用例（新用例贴 marker 即自动
      # 纳入，无同步清单）。pytest 对「挑选为空」退出码 5 ⇒ 子集清零时本 job
      # 红，提示撤 job 而非默默空转。
      - name: pytest -m requires_plaita_nodes
        run: |
          python -m pytest plaita-console/backend/tests/console \
            -m requires_plaita_nodes --timeout=150 --timeout-method=thread -q -rs

  gate:
    name: Regression gate (py${{ matrix.python-version }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 3.12/3.13 为 2026-09 版本矩阵评审补充：本机验证一直在 3.13、CI 只测
        # 3.10，中间版本从未被任何环境覆盖
        python-version: ["3.13"]
    runs-on: ubuntu-24.04
    # 容器隔离绕行（2026-10-01）：runner 宿主环境层面停滞（四轮消元：
    # matrix/cache/label/测试本身均排除——纯 main 可复现、本地 mac+linux
    # 断网全量 70-102s 绿、日志 blob 从未上传）。把门禁整体搬进
    # python:3.13 容器（本地 docker 同构环境实测全绿 102s）。
    container:
      image: python:3.13
      # 显式放宽内存：GH 容器作业默认 docker 内存上限较低时 OOM killer 会
      # SIGKILL 最大的进程（=pytest），死点随内存曲线漂移（18%/39%/43% 均
      # 见证）。撤掉这个变量即可定位。
      options: --memory 6g --memory-swap 6g
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      # 容器内不用 actions/setup-python：容器镜像即目标 Python（3.13），
      # 混用两者会出现 tool-cache python 与容器 python 的 PATH 错位
      # （2026-10-02 实证：pip 装进 /usr/local，gate 的 python 解析到
      # /__t → No module named pytest）。一律 python -m pip，杜绝裸 pip。
      - name: Install git + nodejs + redis-server (checkout / code 节点 js 用例依赖 / #80 状态序列化等真 Redis 用例)
        run: apt-get update -q && apt-get install -yq git nodejs redis-server && git --version && node --version
      - name: Start Redis (127.0.0.1:6379，无持久化——CI 每次全新态)
        run: |
          redis-server --daemonize yes --port 6379 --save '' --appendonly no
          redis-cli ping
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install package + gate deps
        run: |
          python -m pip install --upgrade pip
          # Gate 会 collect/跑到 optional 后端与节点路径（redis/sqlalchemy/http/code/server）。
          # 用 all 一次装齐，避免缺 extra 时在 collection/首个用例上连环红。
          # pytest-timeout：门禁挂死时 150s 内把「卡住的测试」变成带堆栈的快速红，
          # 并给出 durations 排慢（2026-10-01 回归门停滞、日志全黑的教训）。
          python -m pip install -e ".[dev,lint,all]" pytest-timeout build wheel

      - name: Ruff E722 (bare except — hard fail)
        run: ruff check plaita tests --select E722

      # BLE001 历史位点多，按 MIGRATION.md 约定仅 warn、逐步清理；
      # 不能把存量 except Exception 当成硬门禁，否则 main 永远红。
      - name: Ruff BLE001 (blind except — warn only)
        run: ruff check plaita tests --select BLE001 --exit-zero

      # 拆步诊断：停滞只知「卡在 gate 大步内」，拆成 4 相位让 steps API
      # 暴露卡点阶段（ci-gate.sh 支持相位参数；本地四相位全绿）
      # 分块 pytest：GH 容器作业下存在多处「subprocess/进程组演练误伤作业
      # 进程树」的 137 位点（18%→39% 已见两处），单进程长跑必然踩雷。切块
      # 串跑=块间进程隔离，单块损坏不污染其余块；coverage append 合并。
      - name: CI gate [1a/6] pytest integration + e2e
        run: |
          attempt=1
          until python -m pytest tests/integration tests/e2e \
            --cov=plaita --cov-fail-under=0 --cov-report= --timeout=150 -m "not slow" --timeout-method=thread -x -q; do
            if [ $attempt -ge 3 ]; then echo "chunk failed 3 attempts"; exit 1; fi
            attempt=$((attempt+1)); echo "== retry attempt $attempt =="; sleep 10
          done
      - name: CI gate [1b/6] pytest unit A-F
        run: |
          attempt=1
          until find tests/unit -maxdepth 1 -type f -name 'test_*.py' | sort | awk 'NR % 3 == 0' | tr '\n' '\0' | xargs -0 \
            python -m pytest --cov=plaita --cov-append --cov-fail-under=0 --cov-report= --timeout=150 -m "not slow" --timeout-method=thread -x -q; do
            if [ $attempt -ge 3 ]; then echo "chunk failed 3 attempts"; exit 1; fi
            attempt=$((attempt+1)); echo "== retry attempt $attempt =="; sleep 10
          done
      - name: CI gate [1c/6] pytest unit G-Q
        run: |
          attempt=1
          until find tests/unit -maxdepth 1 -type f -name 'test_*.py' | sort | awk 'NR % 3 == 1' | tr '\n' '\0' | xargs -0 \
            python -m pytest --cov=plaita --cov-append --cov-fail-under=0 --cov-report= --timeout=150 -m "not slow" --timeout-method=thread -x -q; do
            if [ $attempt -ge 3 ]; then echo "chunk failed 3 attempts"; exit 1; fi
            attempt=$((attempt+1)); echo "== retry attempt $attempt =="; sleep 10
          done
      # （1d continue-on-error 标记已撤：根因修复 d5d2700 后分块轮连续真绿）
      - name: CI gate [1d/6] pytest unit R-Z
        run: |
          attempt=1
          until find tests/unit -maxdepth 1 -type f -name 'test_*.py' | sort | awk 'NR % 3 == 2' | tr '\n' '\0' | xargs -0 \
            python -m pytest --cov=plaita --cov-append --cov-report=term-missing --cov-fail-under=80 --timeout=150 -m "not slow" --timeout-method=thread -x -q; do
            if [ $attempt -ge 3 ]; then echo "chunk failed 3 attempts"; exit 1; fi
            attempt=$((attempt+1)); echo "== retry attempt $attempt =="; sleep 10
          done
      # #238：DSL 往返 conformance 单独成步——registry×字段矩阵（全节点类型 ×
      # 全字段 × 双链，新字段未登记即红）+ 落地席 harvest 三表示扫掠（丢失
      # 白名单/钉值）+ #220-L2 分支字段全算子回归；也随 tests/unit/test_*.py
      # 分块被收集，这里是具名快速信号（<3s），不替代分块全量。
      - name: CI gate [1e/6] DSL round-trip conformance (#238)
        run: python -m pytest tests/unit/test_issue238_dsl_conformance.py tests/unit/test_dsl_roundtrip_conformance.py tests/unit/test_issue220_l2_parallel_branch_fields.py -x -q
      - name: CI gate [2/4] import layering
        run: bash scripts/ci-gate.sh layering
      - name: CI gate [3/4] wheel contents
        run: bash scripts/ci-gate.sh wheel
      - name: CI gate [4/4] module size SC-003
        run: bash scripts/ci-gate.sh size
