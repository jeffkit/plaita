name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plaita-ai:
    name: plaita-ai (MCP/CLI/agents)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plaita + plaita-ai
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # agent extra 提供 langchain：FoT/ReAct 测试对其 importorskip，
          # 只装 [dev] 会 33 个测试静默 skip 且绿灯（2026-10 修复）
          pip install -e "plaita-ai[dev,agent]"
          # 真实 mcp 导入冒烟：历史上被 sys.modules stub 掩盖（mcp 2.x 即坏）
          python -c "from mcp.server.fastmcp import FastMCP; print('FastMCP OK')"
      - name: pytest plaita-ai
        run: python -m pytest plaita-ai/tests -q

  gate:
    name: Regression gate (crypto self-hosted)
    # 自托管 runner（crypto 服务器，python3.13 @ deadsnakes）：GH 托管 ubuntu
    # runner 存在随机整容器 SIGKILL / 日志失联问题（2026-10-01~02 十余轮排查
    # 未获 GH 侧根因，纯 main 可复现、同机短作业不受影响），门禁迁 crypto 裸机。
    # venv 常驻 self-hosted 机器，依赖安装增量完成。
    runs-on: [self-hosted, crypto]
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Prepare venv (python3.13, 常驻)
        run: |
          python3.13 -m venv "$HOME/plaita-gate-venv"
          "$HOME/plaita-gate-venv/bin/pip" install -q -U pip
          echo "$HOME/plaita-gate-venv/bin" >> "$GITHUB_PATH"

      - name: Install package + gate deps
        run: |
          python -m pip install -q -e ".[dev,lint,all]" pytest-timeout build wheel

      - name: Ruff E722 (bare except — hard fail)
        run: ruff check plaita tests --select E722

      # BLE001 历史位点多，按 MIGRATION.md 约定仅 warn、逐步清理；
      # 不能把存量 except Exception 当成硬门禁，否则 main 永远红。
      - name: Ruff BLE001 (blind except — warn only)
        run: ruff check plaita tests --select BLE001 --exit-zero

      - name: CI regression gate
        run: bash scripts/ci-gate.sh
