name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package + gate deps
        run: |
          python -m pip install --upgrade pip
          # dev: pytest/cov/fakeredis；lint: ruff；yaml: Flow.from_string YAML 路径
          # redis: RedisEventBus 单元路径（fakeredis 仍需 redis 包可 import）
          pip install -e ".[dev,lint,redis,yaml]"
          pip install build wheel

      - name: Ruff E722 (bare except — hard fail)
        run: ruff check plaita tests --select E722

      # BLE001 历史位点多，按 MIGRATION.md 约定仅 warn、逐步清理；
      # 不能把存量 except Exception 当成硬门禁，否则 main 永远红。
      - name: Ruff BLE001 (blind except — warn only)
        run: ruff check plaita tests --select BLE001 --exit-zero

      - name: CI regression gate
        run: bash scripts/ci-gate.sh
