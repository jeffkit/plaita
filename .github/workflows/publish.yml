name: Publish to PyPI

# 推送 v* 标签时发布 plaita（引擎）与 plaita-console（编排台，含打包前端）到 PyPI。
# 前置一次性配置（PyPI trusted publishing）：
#   - pypi.org 上为 plaita / plaita-console 各添加 Pending Publisher，
#     owner=jeffkit repo=plaita workflow=Publish to PyPI environment=pypi
#
# A59-03：workflow_dispatch 不是「任意 ref 发布」的后门——verify-ref 在 build
# 之前强制 ref_type=tag 且 tag 匹配 v*；两个 build job 都 needs 它。环境保护
# （required reviewers / tag 部署策略）与 action SHA 固定是仓库设置/本文件的
# 另一半，见 docs/landing-and-acceptance.md。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ref:
    name: 校验发布 ref（仅允许 v* 标签）
    runs-on: ubuntu-latest
    steps:
      - name: Require v* tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::publish 只允许从 v* 标签触发（当前 ref_type=$REF_TYPE ref_name=$REF_NAME）。workflow_dispatch 请选择 tag ref。"
            exit 1
          fi
          case "$REF_NAME" in
            v*) echo "✓ ref 是版本标签: $REF_NAME" ;;
            *)
              echo "::error::标签名必须以 v 开头（当前 $REF_NAME）"
              exit 1
              ;;
          esac

  build-engine:
    needs: verify-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 校验 tag 与 plaita 版本一致（不一致 fail-fast）
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          expected="${tag#v}"
          actual="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          if [ -z "$actual" ]; then
            echo "::error::无法从 pyproject.toml 读到 version 字段"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::tag=$tag 与 plaita 版本不一致: pyproject.toml version=$actual，期望 $expected"
            exit 1
          fi
          echo "✓ tag $tag == plaita $actual"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade build && python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-dist
          path: dist/

  build-console:
    needs: verify-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: 校验 tag 与 plaita-console 版本一致（不一致 fail-fast）
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          expected="${tag#v}"
          actual="$(sed -n 's/^version = "\(.*\)"$/\1/p' plaita-console/pyproject.toml | head -n1)"
          if [ -z "$actual" ]; then
            echo "::error::无法从 plaita-console/pyproject.toml 读到 version 字段"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::tag=$tag 与 plaita-console 版本不一致: pyproject.toml version=$actual，期望 $expected"
            exit 1
          fi
          echo "✓ tag $tag == plaita-console $actual"
      - name: 构建前端并打 wheel（backend/webDist 随包分发）
        run: plaita-console/scripts/build_package.sh
      # #266 A61-03：发布路径独立复扫。build_package.sh 已在打包前 fail-fast；
      # 这一步直接扫随 wheel 出货的 webDist，防止构建脚本被绕过/改坏。
      - name: 扫描发布产物 webDist（#266 管理密钥通道）
        run: >-
          node plaita-console/frontend/scripts/check-admin-key.mjs
          --dist plaita-console/backend/webDist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: console-dist
          path: plaita-console/dist/

  publish:
    needs: [verify-ref, build-engine, build-console]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: engine-dist
          path: engine-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: console-dist
          path: console-dist
      - name: Publish plaita
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: engine-dist
      - name: Publish plaita-console
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: console-dist
