name: Publish to PyPI

# 推送 v* 标签时发布 plaita（引擎）与 plaita-console（编排台，含打包前端）到 PyPI。
# 前置一次性配置（PyPI trusted publishing）：
#   - pypi.org 上为 plaita / plaita-console 各添加 Pending Publisher，
#     owner=jeffkit repo=plaita workflow=Publish to PyPI environment=pypi
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: engine-dist
          path: dist/

  build-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: 构建前端并打 wheel（backend/webDist 随包分发）
        run: plaita-console/scripts/build_package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: plaita-console/dist/

  publish:
    needs: [build-engine, build-console]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine-dist
      - uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: console-dist
      - name: Publish plaita
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: engine-dist
      - name: Publish plaita-console
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: console-dist
