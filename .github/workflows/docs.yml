name: Deploy docs

# 触发面 = 构建消费面：mkdocs（docs-site/**）+ mkdocstrings 内省 plaita 包
# （plaita/**，经 `pip install .` 装入 → pyproject.toml / setup.py 也算；
# 2026-10-23 核口径补入）。
on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "plaita/**"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs-site/requirements.txt

      - name: Install project (for mkdocstrings introspection)
        run: |
          # 安装核心依赖即可让 mkdocstrings 内省 plaita 包；可选 extra 不装也能构建
          # （可选模块在 API 页中通过 ::: 引用时，griffe 会按需解析）
          pip install .

      - name: Build site
        run: mkdocs build -f docs-site/mkdocs.yml --clean --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
