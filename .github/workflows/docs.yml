name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "plaita/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs-site/requirements.txt

      - name: Install project (for mkdocstrings introspection)
        run: |
          # 安装核心依赖即可让 mkdocstrings 内省 plaita 包；可选 extra 不装也能构建
          # （可选模块在 API 页中通过 ::: 引用时，griffe 会按需解析）
          pip install .

      - name: Build site
        run: mkdocs build -f docs-site/mkdocs.yml --clean --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
